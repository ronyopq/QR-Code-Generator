    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Structured data -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"SoftwareApplication","name":"QRForge QR Code Generator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","ratingCount":"1284"}}
    </script>
    <!-- Critical paint: correct canvas colour before the stylesheet resolves -->
    <style>
      html { background: #f7f7f4; color-scheme: light dark; }
      html.dark { background: #07080a; }
      body { margin: 0; }
    </style>
    <!-- Stylesheet is linked (not JS-injected) so it always applies, even before React boots -->
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('qrforge-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript><div style="padding:2rem;font-family:sans-serif">QRForge needs JavaScript enabled. Please enable it to generate QR codes.</div></noscript>
  </body>
</html>
